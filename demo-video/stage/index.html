<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<title>知径 DB Demo Stage</title>
<style>
  :root{ --ink:#f7f3ee; --muted:#a9a39c; --accent:#e07a52; --accent2:#f3b28f; --bg:#08090c; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;letter-spacing:.02em}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden}
  .stars{position:absolute;inset:0}
  .star{position:absolute;border-radius:50%;background:#fff;opacity:.5;animation:twinkle var(--dur) ease-in-out infinite;animation-delay:var(--delay)}
  @keyframes twinkle{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:.75;transform:scale(1.15)}}
  .grid{position:absolute;inset:-1px;
    background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
    background-size:84px 84px;
    mask-image:radial-gradient(circle at 50% 45%,rgba(0,0,0,.95),transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 45%,rgba(0,0,0,.95),transparent 72%)}
  .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
  .glow.a{width:820px;height:820px;left:-160px;top:80px;background:rgba(224,122,82,.22)}
  .glow.b{width:700px;height:700px;right:-100px;bottom:-140px;background:rgba(90,160,180,.18)}
  .shot{position:absolute;right:-260px;top:40px;width:1280px;opacity:0;filter:blur(30px) brightness(.32) saturate(.75);
    mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.28) 26%,rgba(0,0,0,.55) 60%,transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.28) 26%,rgba(0,0,0,.55) 60%,transparent 100%);
    animation:shotIn 3.2s ease-out .9s both}
  @keyframes shotIn{from{opacity:0;transform:translateX(60px) scale(1.02)}to{opacity:.3;transform:translateX(0) scale(1)}}
  .eyebrow{font-size:22px;letter-spacing:.34em;color:var(--accent2);text-transform:uppercase}
  .brand{font-size:148px;font-weight:800;letter-spacing:.01em;line-height:1;
    background:linear-gradient(100deg,#fff 10%,#ffd9c6 46%,#e07a52 96%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{font-size:44px;font-weight:600;color:var(--ink)}
  .sub{font-size:24px;color:var(--muted);letter-spacing:.08em}
  .rule{width:76px;height:3px;background:var(--accent);border-radius:3px}
  .scene{position:absolute;inset:0;padding:0 150px;opacity:0;pointer-events:none}
  body[data-scene="intro"] .scene.intro,
  body[data-scene="pain"] .scene.pain,
  body[data-scene="outro"] .scene.outro{opacity:1}

  .intro .wrap{position:absolute;left:150px;top:300px;width:960px;display:flex;flex-direction:column;gap:34px}
  .intro .eyebrow{animation:fadeUp 1.1s ease-out .35s both}
  .intro .brand{animation:fadeUp 1.3s cubic-bezier(.2,.7,.2,1) .6s both}
  .intro .tagline{animation:fadeUp 1.2s ease-out 1.45s both}
  .intro .rule{animation:grow 1s ease-out 2.2s both}
  .intro .sub{animation:fadeUp 1.2s ease-out 2.45s both}
  .intro .fadeout{position:absolute;inset:0;background:#000;opacity:0;animation:blackout .9s ease-in 10.9s both;z-index:20}

  .pain .head{position:absolute;left:150px;top:120px;display:flex;gap:20px;align-items:center;animation:fadeUp 1s ease-out .3s both}
  .pain .head .rule{width:52px}
  .pain .head .eyebrow{color:var(--muted);letter-spacing:.3em}
  .pain .list{position:absolute;left:150px;top:250px;display:flex;flex-direction:column;gap:56px}
  .pain .item{display:flex;align-items:baseline;gap:44px;opacity:0}
  .pain .item .num{font-size:96px;font-weight:800;line-height:1;min-width:430px;
    background:linear-gradient(120deg,#fff 20%,#f0b394 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pain .item .desc{font-size:32px;color:var(--muted);letter-spacing:.06em}
  .pain .item:nth-child(1){animation:fadeLeft 1s ease-out .8s both}
  .pain .item:nth-child(2){animation:fadeLeft 1s ease-out 2.6s both}
  .pain .item:nth-child(3){animation:fadeLeft 1s ease-out 4.4s both}
  .pain .close{position:absolute;left:150px;bottom:170px;font-size:44px;font-weight:600;
    animation:fadeUp 1.1s ease-out 7.2s both}
  .pain .close em{font-style:normal;color:var(--accent2)}
  .pain .fadeout{position:absolute;inset:0;background:#000;opacity:0;animation:blackout .8s ease-in 12.6s both;z-index:20}

  .outro .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center}
  .outro .brand{font-size:112px;animation:fadeUp 1.3s cubic-bezier(.2,.7,.2,1) .5s both}
  .outro .slogan{font-size:46px;font-weight:600;animation:fadeUp 1.2s ease-out 1.5s both}
  .outro .sub{font-size:22px;letter-spacing:.16em;animation:fadeUp 1.1s ease-out 2.3s both}
  .outro .rule{animation:grow 1s ease-out 2s both}
  .outro .fadeout{position:absolute;inset:0;background:#000;opacity:0;animation:blackout .8s ease-in 8.6s both;z-index:20}
  .outro .endcard{position:absolute;bottom:86px;left:0;right:0;text-align:center;font-size:18px;color:#6f6a64;letter-spacing:.24em;animation:fadeUp 1s ease-out 2.8s both}

  @keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeLeft{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:translateX(0)}}
  @keyframes grow{from{opacity:0;transform:scaleX(.2);transform-origin:left}to{opacity:1;transform:scaleX(1);transform-origin:left}}
  @keyframes blackout{from{opacity:0}to{opacity:1}}
</style>
</head>
<body data-scene="intro">
<div id="stage">
  <div class="stars" id="stars"></div>
  <div class="grid"></div>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <section class="scene intro">
    <img class="shot" src="../probe/home.png" alt="" />
    <div class="wrap">
      <div class="eyebrow">Multi-Agent Learning System</div>
      <div class="brand">知径 DB</div>
      <div class="tagline">让每一条学习路径，都有证据。</div>
      <div class="rule"></div>
      <div class="sub">面向《数据库原理》的多智能体个性化学习系统</div>
    </div>
    <div class="fadeout"></div>
  </section>

  <section class="scene pain">
    <div class="head"><div class="rule"></div><div class="eyebrow">课前，三个断点</div></div>
    <div class="list">
      <div class="item"><div class="num">45 个</div><div class="desc">知识点，不知道从哪里补</div></div>
      <div class="item"><div class="num">210 道</div><div class="desc">SQL 题，练完还是不会</div></div>
      <div class="item"><div class="num">几十人</div><div class="desc">一个班，没人有空逐个诊断</div></div>
    </div>
    <div class="close">问题不在努力，在于<em>看不见薄弱点</em>。</div>
    <div class="fadeout"></div>
  </section>

  <section class="scene outro">
    <div class="wrap">
      <div class="brand">知径 DB</div>
      <div class="rule"></div>
      <div class="slogan">看得见的路径，可解释的成长</div>
      <div class="sub">真实 SQL 沙箱 / 多智能体编排 / 确定性降级</div>
    </div>
    <div class="endcard">DEMO BUILD · 2026</div>
    <div class="fadeout"></div>
  </section>
</div>

<script>
  const q = new URLSearchParams(location.search);
  const scene = q.get('scene') || 'intro';
  document.body.dataset.scene = scene;
  const stars = document.getElementById('stars');
  const n = 110;
  let html = '';
  for (let i = 0; i < n; i++) {
    const size = (Math.random() * 2.1 + 0.7).toFixed(1);
    const x = (Math.random() * 100).toFixed(2);
    const y = (Math.random() * 100).toFixed(2);
    const dur = (Math.random() * 5 + 3).toFixed(1);
    const delay = (Math.random() * 6).toFixed(1);
    html += '<span class="star" style="width:' + size + 'px;height:' + size + 'px;left:' + x + '%;top:' + y + '%;--dur:' + dur + 's;--delay:' + delay + 's"></span>';
  }
  stars.innerHTML = html;
</script>
</body>
</html>
